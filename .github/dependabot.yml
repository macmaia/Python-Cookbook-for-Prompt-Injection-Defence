# Keeps the pinned actions in pages.yml and the Python
# dependencies in requirements.txt up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Jupyter Book 2 is a different system that doesn't read _config.yml,
      # _toc.yml or the Sphinx extensions this book uses.
      - dependency-name: jupyter-book
        update-types: ["version-update:semver-major"]
